<!DOCTYPE html>
<html>
<head>
    <title>Frames using iframe</title>
</head>

<body>

    <!-- Top Frame -->
    <iframe srcdoc="
        <html>
        <body style='background-color:lightblue; text-align:center;'>
            <h1>My College Website</h1>
        </body>
        </html>
    " width="100%" height="100"></iframe>

    <br>

    <!-- Left and Right Frames -->
    <iframe srcdoc="
        <html>
        <body style='background-color:lightgray;'>
            <h3>Menu</h3>
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>
        </body>
        </html>
    " width="30%" height="300"></iframe>

    <iframe srcdoc="
        <html>
        <body>
            <h2>Welcome</h2>
            <p>This is the content area.</p>
        </body>
        </html>
    " width="68%" height="300"></iframe>

</body>
</html>
